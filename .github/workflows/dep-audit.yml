name: Dependency Audit

on:
  schedule:
    - cron: "0 8 * * 1"
  pull_request:
    paths: ["uv.lock", "pyproject.toml"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  osv-scan:
    name: OSV Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Export lockfile
        run: uv export --format requirements-txt --no-hashes --no-emit-project > "$GITHUB_WORKSPACE/requirements.txt"
      # --no-resolve: the export already pins every transitive dependency, and
      # osv-scanner's resolver ignores environment markers, so it merges a
      # package's per-Python-version requirements into an impossible range
      # (virtualenv's filelock pins for <3.10 and >=3.10) and exits 127.
      - uses: google/osv-scanner-action/osv-scanner-action@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
        with:
          scan-args: |-
            -r
            --no-resolve
            --config=/github/workspace/osv-scanner.toml
            --lockfile=/github/workspace/requirements.txt
