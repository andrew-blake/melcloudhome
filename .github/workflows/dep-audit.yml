name: Dependency Audit

on:
  schedule:
    - cron: "0 8 * * 1"
  pull_request:
    paths: ["uv.lock", "pyproject.toml"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  osv-scan:
    name: OSV Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - name: Export lockfile
        run: uv export --format requirements-txt --no-hashes --no-emit-project > "$GITHUB_WORKSPACE/requirements.txt"
      - uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          scan-args: |-
            -r
            --config=/github/workspace/osv-scanner.toml
            --lockfile=/github/workspace/requirements.txt
