# Distinct project name so test runs never clobber the dev environment's
# containers (both files define a melcloud-mock service; without this they
# share the directory-derived project name and steal each other's container).
name: melcloudhome-test

services:
  # Mock MELCloud API Server (rate limiting disabled for CI tests)
  melcloud-mock:
    image: melcloudhome-mock:latest
    build:
      context: .
      dockerfile: Dockerfile.mock
    command: python tools/mock_melcloud_server.py --host 0.0.0.0 --port 8080 --no-rate-limit
    networks:
      - test-network
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s = socket.socket(); s.connect(('localhost', 8080)); s.close()"]
      interval: 1s
      timeout: 5s
      retries: 10
      start_period: 2s

  # Integration tests on the latest HA: Python 3.14 + pytest-homeassistant
  # (socket blocking enabled). `uv run --no-sync` keeps HA's pinned versions;
  # a plain `uv run` re-syncs the env back to uv.lock.
  integration-tests:
    image: melcloudhome-test:latest
    build:
      context: .
      dockerfile: Dockerfile.test
    volumes:
      - ./coverage-output:/app/coverage-output
      - ./custom_components:/app/custom_components:ro
      - ./tests:/app/tests:ro
      - ./tools:/app/tools:ro
      - ./ci/latest-ha/requirements.txt:/app/ci/latest-ha/requirements.txt:ro
      - uv-cache:/root/.cache/uv
    working_dir: /app
    networks:
      - test-network
    depends_on:
      melcloud-mock:
        condition: service_healthy
    environment:
      - MELCLOUD_MOCK_URL=http://melcloud-mock:8080
      - COVERAGE_FILE=/app/coverage-output/.coverage
    command: sh -c "uv pip install -r ci/latest-ha/requirements.txt && uv run --no-sync pytest tests/integration/ -p no:respx -v --cov=custom_components/melcloudhome --cov-append --cov-report="

  # Integration tests on the hacs.json HA floor: Python 3.13, because
  # pytest-homeassistant-custom-component 0.13.269 (HA 2025.8.0) won't
  # install on 3.14. The command lives in the Makefile (test-integration-floor).
  integration-tests-floor:
    image: melcloudhome-test:py313
    build:
      context: .
      dockerfile: Dockerfile.test
      args:
        PYTHON_VERSION: "3.13"
    volumes:
      - ./custom_components:/app/custom_components:ro
      - ./tests:/app/tests:ro
      - uv-cache:/root/.cache/uv
    working_dir: /app
    networks:
      - test-network

  # E2E tests without any HA test package (real network access), Python 3.14
  e2e-tests:
    image: melcloudhome-test:latest
    build:
      context: .
      dockerfile: Dockerfile.test
    volumes:
      - ./coverage-output:/app/coverage-output
      - ./custom_components:/app/custom_components:ro
      - ./tests:/app/tests:ro
      - ./tools:/app/tools:ro
      - uv-cache:/root/.cache/uv
    working_dir: /app
    networks:
      - test-network
    depends_on:
      melcloud-mock:
        condition: service_healthy
    environment:
      - MELCLOUD_MOCK_URL=http://melcloud-mock:8080
      - COVERAGE_FILE=/app/coverage-output/.coverage
      - PYTEST_DISABLE_SOCKET_ALLOW_HOSTS=melcloud-mock,localhost,127.0.0.1
    command: sh -c "uv run pytest tests/api/ -m e2e -v --cov=custom_components/melcloudhome --cov-append --cov-report="

volumes:
  uv-cache:

networks:
  test-network:
    name: melcloud-test-network
